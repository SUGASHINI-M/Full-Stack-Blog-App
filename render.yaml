services:
  - type: web
    name: full-stack-blog-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: blog
      - key: JWT_SECRET
        sync: false

  - type: web
    name: full-stack-blog-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://full-stack-blog-api.onrender.com/api